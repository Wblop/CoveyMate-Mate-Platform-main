    <footer class="site-footer">
      <div class="sm-container site-footer__inner">
        @if (showHelpLinks) {
          <section class="site-footer__help" aria-label="Help links">
            <p class="site-footer__help-title">Help</p>
            <div class="site-footer__help-links">
              <a routerLink="/docs">Guides</a>
              <a [routerLink]="['/docs']" fragment="faq">FAQ</a>
              <a href="mailto:support@conveymate.com.au">Contact support</a>
            </div>
          </section>
        }

        <div class="site-footer__meta">
          <nav aria-label="Footer links" class="site-footer__links">
            <a [attr.href]="siteUrls.marketingHref('/legal/privacy')">Privacy</a>
            <a [attr.href]="siteUrls.marketingHref('/legal/terms')">Terms</a>
            <a [attr.href]="siteUrls.marketingHref('/legal/disclaimer')">Disclaimer</a>
            <a href="mailto:support@conveymate.com.au">Contact</a>
            <a [attr.href]="siteUrls.marketingHref('/legal/accessibility')">Accessibility</a>
          </nav>
          <div class="site-footer__meta-note">
            <p class="site-footer__ai-note">AI can make mistakes</p>
            <p class="site-footer__aussie-made">
              <span>Aussie Made</span>
              <span class="site-footer__aussie-icon" aria-hidden="true">
                <svg viewBox="0 0 512 512" focusable="false">
                  <path
                    d="m380.37 28.839l-27.24 100.215l-64-48l17.405-34.46l-83.863 8.079l-13.541 42.38l-35.512-25.482l-67.16 85.62l-83.008 48.593l34.81 156.752l38.87 6.518l112-64l74.38 52.082l21.62-28.094l32 72.012L424 415.452l64.549-126.398l-6.014-64.703l-65.404-79.297l-36.762-116.215zm-14.75 411.238l15.099 43.084l20.412-2.107l11.435-35.864l-46.947-5.113z"
                  ></path>
                </svg>
              </span>
            </p>
          </div>
        </div>
        <p class="site-footer__copy">
          © {{ year }} ConveyMate.
          @if (lastUpdated) {
            <span> Last updated {{ lastUpdated }}.</span>
          }
        </p>
      </div>
    </footer>
