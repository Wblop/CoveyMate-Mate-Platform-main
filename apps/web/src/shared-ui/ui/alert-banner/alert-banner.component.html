    <section class="ui-alert" [ngClass]="'ui-alert--' + tone" [attr.aria-live]="tone === 'error' ? 'assertive' : 'polite'" [attr.role]="tone === 'error' ? 'alert' : 'status'">
      <div class="ui-alert__header">
        <svg class="ui-alert__icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          @switch (tone) {
            @case ('success') {
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            }
            @case ('error') {
              <circle cx="12" cy="12" r="10"/>
              <line x1="15" y1="9" x2="9" y2="15"/>
              <line x1="9" y1="9" x2="15" y2="15"/>
            }
            @case ('warn') {
              <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
              <line x1="12" y1="9" x2="12" y2="13"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            }
            @default {
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            }
          }
        </svg>
        <p class="ui-alert__title">{{ title }}</p>
      </div>
      @if (message) {
        <p class="ui-alert__message">{{ message }}</p>
      }
      <ng-content></ng-content>
    </section>
