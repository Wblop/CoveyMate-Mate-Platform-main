@if (notifications.length > 0) {
  <section class="site-notification-stack" aria-label="Platform notifications">
    @for (notification of notifications; track notification.id) {
      <div
        class="site-notification"
        [attr.data-tone]="notification.tone"
        [attr.aria-live]="notification.tone === 'warning' ? 'assertive' : 'polite'"
        [attr.role]="notification.tone === 'warning' ? 'alert' : 'status'"
      >
        <div class="sm-container site-notification__inner">
          <div class="site-notification__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              @if (notification.tone === 'warning') {
                <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
                <line x1="12" y1="9" x2="12" y2="13" />
                <line x1="12" y1="17" x2="12.01" y2="17" />
              } @else {
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
              }
            </svg>
          </div>

          <div class="site-notification__content">
            <p class="site-notification__label">{{ headingForTone(notification.tone) }}</p>
            <p class="site-notification__message">{{ formattedMessage(notification.message) }}</p>
          </div>
        </div>
      </div>
    }
  </section>
}
