    <header class="app-header">
      <div class="app-header__inner sm-container">
        <div class="app-header__left">
          <button
            type="button"
            class="app-header__drawer-toggle"
            [attr.aria-expanded]="sidebarOpen"
            aria-label="Toggle navigation menu"
            (click)="sidebarToggle.emit()"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>

          <a class="app-header__brand" routerLink="/dashboard">ConveyMate</a>
        </div>

        <div class="app-header__right">
          <a class="app-header__home-link" [attr.href]="siteUrls.marketingHref('/')" aria-label="Go to the landing page">
            Home
          </a>

          <div class="app-header__menu-wrap">
            <button
              #menuTrigger
              type="button"
              class="app-header__menu-trigger"
              aria-haspopup="menu"
              aria-controls="user-menu"
              [attr.aria-expanded]="menuOpen()"
              (click)="toggleMenu()"
              (keydown)="onMenuTriggerKeydown($event)"
            >
              <span class="app-header__avatar">{{ initials((userService.user$ | async)?.fullName) }}</span>
              <span class="app-header__name">{{ (userService.user$ | async)?.fullName || 'Account' }}</span>
              <svg viewBox="0 0 24 24" aria-hidden="true" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>

            @if (menuOpen()) {
              <div #menuPanel id="user-menu" class="app-header__menu" role="menu" aria-label="Account options" (keydown)="onMenuKeydown($event)">
                @if (userService.user$ | async; as user) {
                  <p class="app-header__menu-email">{{ user.email }}</p>
                }
                <a [attr.href]="siteUrls.marketingHref('/')" role="menuitem" (click)="closeMenu()">Home</a>
                <a routerLink="/account" role="menuitem" (click)="closeMenu()">Account</a>
                <a routerLink="/docs" role="menuitem" (click)="closeMenu()">Guides</a>
                <button type="button" role="menuitem" (click)="emitFeedback()">Feedback</button>
                <button type="button" role="menuitem" class="app-header__menu-signout" (click)="emitSignOut()">Sign out</button>
              </div>
            }
          </div>
        </div>
      </div>
    </header>
