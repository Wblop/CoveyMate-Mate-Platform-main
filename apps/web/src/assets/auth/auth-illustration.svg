<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" fill="none" aria-hidden="true">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="rgba(255,255,255,0.09)"/>
    </pattern>
    <filter id="blur-lg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="blur-sm" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Dot grid -->
  <rect width="400" height="520" fill="url(#dots)"/>

  <!-- Background glows -->
  <ellipse cx="310" cy="90" rx="170" ry="130" fill="rgba(120,190,255,0.1)" filter="url(#blur-lg)"/>
  <ellipse cx="70" cy="420" rx="150" ry="120" fill="rgba(80,155,230,0.13)" filter="url(#blur-lg)"/>

  <!-- ===== MAIN DOCUMENT CARD ===== -->
  <rect x="50" y="88" width="224" height="316" rx="16" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>

  <!-- Card header bar -->
  <rect x="50" y="88" width="224" height="48" rx="16" fill="rgba(255,255,255,0.1)"/>
  <rect x="50" y="120" width="224" height="16" fill="rgba(255,255,255,0.1)"/>

  <!-- Header dots -->
  <circle cx="74" cy="114" r="5" fill="rgba(255,255,255,0.28)"/>
  <circle cx="90" cy="114" r="5" fill="rgba(255,255,255,0.18)"/>
  <circle cx="106" cy="114" r="5" fill="rgba(255,255,255,0.11)"/>

  <!-- Doc title line -->
  <rect x="74" y="107" width="76" height="7" rx="3.5" fill="rgba(255,255,255,0.22)"/>

  <!-- Section label -->
  <rect x="74" y="154" width="54" height="16" rx="5" fill="rgba(30,130,255,0.28)"/>
  <rect x="76" y="158" width="50" height="6" rx="3" fill="rgba(190,225,255,0.55)"/>

  <!-- Text lines - group 1 -->
  <rect x="74" y="182" width="154" height="7" rx="3.5" fill="rgba(255,255,255,0.26)"/>
  <rect x="74" y="196" width="118" height="7" rx="3.5" fill="rgba(255,255,255,0.15)"/>
  <rect x="74" y="210" width="142" height="7" rx="3.5" fill="rgba(255,255,255,0.2)"/>

  <!-- Highlighted clause block -->
  <rect x="64" y="232" width="192" height="50" rx="9" fill="rgba(80,165,255,0.16)" stroke="rgba(130,195,255,0.38)" stroke-width="1"/>
  <rect x="74" y="241" width="136" height="6" rx="3" fill="rgba(175,220,255,0.55)"/>
  <rect x="74" y="253" width="98" height="6" rx="3" fill="rgba(175,220,255,0.32)"/>
  <rect x="74" y="269" width="54" height="18" rx="5" fill="rgba(25,130,255,0.35)"/>
  <rect x="77" y="273" width="48" height="6" rx="3" fill="rgba(200,235,255,0.65)"/>

  <!-- Text lines - group 2 -->
  <rect x="74" y="298" width="150" height="7" rx="3.5" fill="rgba(255,255,255,0.2)"/>
  <rect x="74" y="312" width="90" height="7" rx="3.5" fill="rgba(255,255,255,0.13)"/>
  <rect x="74" y="326" width="132" height="7" rx="3.5" fill="rgba(255,255,255,0.17)"/>
  <rect x="74" y="340" width="66" height="7" rx="3.5" fill="rgba(255,255,255,0.11)"/>

  <!-- Signature line area -->
  <rect x="74" y="364" width="82" height="22" rx="5" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <rect x="166" y="364" width="82" height="22" rx="5" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Dashed connector from badge to card -->
  <line x1="252" y1="156" x2="274" y2="156" stroke="rgba(255,255,255,0.16)" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ===== FLOATING TAG CARDS ===== -->
  <!-- Status tag - right -->
  <rect x="292" y="236" width="90" height="36" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <circle cx="311" cy="254" r="6" fill="rgba(80,200,140,0.55)"/>
  <rect x="323" y="248" width="48" height="6" rx="3" fill="rgba(255,255,255,0.36)"/>
  <rect x="323" y="258" width="34" height="5" rx="2.5" fill="rgba(255,255,255,0.18)"/>

  <!-- Warning tag - left -->
  <rect x="14" y="208" width="80" height="36" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.17)" stroke-width="1"/>
  <circle cx="33" cy="226" r="6" fill="rgba(255,185,80,0.55)"/>
  <rect x="46" y="220" width="38" height="6" rx="3" fill="rgba(255,255,255,0.32)"/>
  <rect x="46" y="230" width="26" height="5" rx="2.5" fill="rgba(255,255,255,0.16)"/>

  <!-- Info tag - bottom right -->
  <rect x="296" y="328" width="82" height="34" rx="10" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="314" y="337" width="48" height="6" rx="3" fill="rgba(255,255,255,0.3)"/>
  <rect x="314" y="347" width="34" height="5" rx="2.5" fill="rgba(255,255,255,0.15)"/>

  <!-- ===== SMALL DECORATIVE ELEMENTS ===== -->
  <!-- Top-left corner box -->
  <rect x="18" y="52" width="30" height="30" rx="9" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <circle cx="33" cy="67" r="7" fill="rgba(255,255,255,0.1)"/>

  <!-- Top-right dots cluster -->
  <circle cx="360" cy="66" r="5.5" fill="rgba(255,255,255,0.14)"/>
  <circle cx="375" cy="80" r="3.5" fill="rgba(255,255,255,0.1)"/>
  <circle cx="352" cy="82" r="3" fill="rgba(255,255,255,0.08)"/>

  <!-- Bottom-left circles -->
  <circle cx="32" cy="450" r="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <circle cx="58" cy="466" r="9" fill="rgba(130,195,255,0.16)"/>

  <!-- Bottom-right accent ring -->
  <circle cx="368" cy="424" r="26" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.11)" stroke-width="1"/>
  <circle cx="368" cy="424" r="13" fill="rgba(255,255,255,0.06)"/>

  <!-- Wave path bottom -->
  <path d="M80 480 Q130 464 180 476 Q230 488 280 472" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
