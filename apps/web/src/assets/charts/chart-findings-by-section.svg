<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" fill="none" aria-hidden="true">
  <defs>
    <filter id="fs-shadow" x="-5%" y="-5%" width="114%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f2a3c" flood-opacity="0.09"/>
    </filter>
    <radialGradient id="fs-glow" cx="65%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#d9ebf6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d9ebf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="370" cy="50" rx="210" ry="130" fill="url(#fs-glow)"/>

  <!-- Card -->
  <rect x="20" y="10" width="520" height="280" rx="22" fill="#ffffff" stroke="#d0dce7" stroke-width="1.5" filter="url(#fs-shadow)"/>

  <!-- Header band -->
  <rect x="20" y="10" width="520" height="56" rx="22" fill="#f0f6fb"/>
  <rect x="20" y="46" width="520" height="20" fill="#f0f6fb"/>

  <text x="50" y="44" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0b3c5d" letter-spacing="-0.01em">Findings by Report Section</text>

  <!-- Legend -->
  <rect x="280" y="28" width="10" height="10" rx="2" fill="#c14438"/>
  <text x="296" y="38" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#425667">Critical</text>
  <rect x="344" y="28" width="10" height="10" rx="2" fill="#c47d16"/>
  <text x="360" y="38" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#425667">High</text>
  <rect x="398" y="28" width="10" height="10" rx="2" fill="#1a7ba4"/>
  <text x="414" y="38" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#425667">Medium</text>
  <rect x="468" y="28" width="10" height="10" rx="2" fill="#2a9c52"/>
  <text x="484" y="38" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#425667">Low</text>

  <!--
    Stacked horizontal bar chart
    5 sections, each row is a stacked bar showing findings by severity
    Bar start x=200, max width=300px (represents total 15 findings)
    1 finding = 20px
    Rows at y = 86, 126, 166, 206, 246
    Sections:
      Contract terms:   crit=1 high=1 med=2 low=0 → total=4 → 80px
      Title:            crit=0 high=1 med=2 low=1 → total=4 → 80px
      Disclosures:      crit=1 high=1 med=1 low=1 → total=4 → 80px
      Planning:         crit=0 high=1 med=0 low=1 → total=2 → 40px
      Settlement:       crit=0 high=0 med=1 low=0 → total=1 → 20px
      Total = 15 ✓
  -->

  <!-- Row 1: Contract terms (4 findings: 1C 1H 2M 0L) -->
  <text x="48" y="95" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#172532">Contract terms</text>
  <rect x="200" y="84" width="300" height="16" rx="8" fill="#f4f7fa"/>
  <rect x="200" y="84" width="20"  height="16" rx="0" fill="#c14438"/><!-- crit 1 -->
  <rect x="220" y="84" width="20"  height="16" rx="0" fill="#c47d16"/><!-- high 1 -->
  <rect x="240" y="84" width="40"  height="16" rx="0" fill="#1a7ba4"/><!-- med 2 -->
  <!-- Round left/right ends -->
  <rect x="200" y="84" width="8"   height="16" rx="0" fill="#c14438"/>
  <circle cx="200" cy="92" r="8" fill="#c14438"/>
  <rect x="272" y="84" width="8"   height="16" rx="0" fill="#1a7ba4"/>
  <circle cx="280" cy="92" r="8" fill="#1a7ba4"/>
  <text x="288" y="96" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#425667">4</text>

  <!-- Row 2: Title (4 findings: 0C 1H 2M 1L) -->
  <text x="48" y="135" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#172532">Title &amp; ownership</text>
  <rect x="200" y="124" width="300" height="16" rx="8" fill="#f4f7fa"/>
  <rect x="200" y="124" width="20"  height="16" rx="0" fill="#c47d16"/>
  <rect x="220" y="124" width="40"  height="16" rx="0" fill="#1a7ba4"/>
  <rect x="260" y="124" width="20"  height="16" rx="0" fill="#2a9c52"/>
  <circle cx="200" cy="132" r="8" fill="#c47d16"/>
  <circle cx="280" cy="132" r="8" fill="#2a9c52"/>
  <text x="288" y="136" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#425667">4</text>

  <!-- Row 3: Disclosures (4 findings: 1C 1H 1M 1L) -->
  <text x="48" y="175" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#172532">Disclosures</text>
  <rect x="200" y="164" width="300" height="16" rx="8" fill="#f4f7fa"/>
  <rect x="200" y="164" width="20"  height="16" rx="0" fill="#c14438"/>
  <rect x="220" y="164" width="20"  height="16" rx="0" fill="#c47d16"/>
  <rect x="240" y="164" width="20"  height="16" rx="0" fill="#1a7ba4"/>
  <rect x="260" y="164" width="20"  height="16" rx="0" fill="#2a9c52"/>
  <circle cx="200" cy="172" r="8" fill="#c14438"/>
  <circle cx="280" cy="172" r="8" fill="#2a9c52"/>
  <text x="288" y="176" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#425667">4</text>

  <!-- Row 4: Planning (2 findings: 0C 1H 0M 1L) -->
  <text x="48" y="215" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#172532">Planning &amp; zoning</text>
  <rect x="200" y="204" width="300" height="16" rx="8" fill="#f4f7fa"/>
  <rect x="200" y="204" width="20"  height="16" rx="0" fill="#c47d16"/>
  <rect x="220" y="204" width="20"  height="16" rx="0" fill="#2a9c52"/>
  <circle cx="200" cy="212" r="8" fill="#c47d16"/>
  <circle cx="240" cy="212" r="8" fill="#2a9c52"/>
  <text x="248" y="216" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#425667">2</text>

  <!-- Row 5: Settlement (1 finding: 0C 0H 1M 0L) -->
  <text x="48" y="255" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#172532">Settlement terms</text>
  <rect x="200" y="244" width="300" height="16" rx="8" fill="#f4f7fa"/>
  <rect x="200" y="244" width="20"  height="16" rx="0" fill="#1a7ba4"/>
  <circle cx="200" cy="252" r="8" fill="#1a7ba4"/>
  <circle cx="220" cy="252" r="8" fill="#1a7ba4"/>
  <text x="228" y="256" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#425667">1</text>

  <!-- Total line -->
  <line x1="44" y1="268" x2="516" y2="268" stroke="#e8f1f7" stroke-width="1"/>
  <text x="48"  y="282" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0b3c5d">Total</text>
  <text x="288" y="282" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0b3c5d">15 findings across 5 sections</text>

  <!-- Divider between label and bar columns -->
  <line x1="190" y1="76" x2="190" y2="262" stroke="#e8f1f7" stroke-width="1"/>
</svg>
