<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" fill="none" aria-hidden="true">
  <!--
    Donut chart: risk distribution by segment
    Total 15 findings: Critical 2, High 4, Medium 6, Low 3
    Circumference of r=80 circle = 2π×80 = 502.65
    Segments (stroke-dasharray: segment gap):
      Critical  2/15 = 13.3% → 66.9  gap = 435.7
      High      4/15 = 26.7% → 134.0 gap = 368.6
      Medium    6/15 = 40.0% → 201.1 gap = 301.6
      Low       3/15 = 20.0% → 100.5 gap = 402.1
    Each segment rotated by cumulative offset (using stroke-dashoffset)
    Start at top (−90° → offset = −502.65×0.25 = −125.7)
    Gap between segments: 3px → adjust segment lengths slightly
  -->
  <defs>
    <filter id="rd-shadow" x="-6%" y="-6%" width="116%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f2a3c" flood-opacity="0.09"/>
    </filter>
    <radialGradient id="rd-glow" cx="38%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#d9ebf6" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#d9ebf6" stop-opacity="0"/>
    </radialGradient>
    <!-- Inner glow on donut -->
    <radialGradient id="rd-inner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0f6fb" stop-opacity="0"/>
      <stop offset="80%" stop-color="#eef5fb" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ddeaf4" stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <!-- Ambient glow -->
  <ellipse cx="178" cy="140" rx="190" ry="150" fill="url(#rd-glow)"/>

  <!-- Card -->
  <rect x="20" y="10" width="440" height="260" rx="22" fill="#ffffff" stroke="#d0dce7" stroke-width="1.5" filter="url(#rd-shadow)"/>

  <!-- Card header band -->
  <rect x="20" y="10" width="440" height="58" rx="22" fill="#f0f6fb"/>
  <rect x="20" y="48" width="440" height="20" fill="#f0f6fb"/>

  <!-- Header title -->
  <text x="50" y="46" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0b3c5d" letter-spacing="-0.01em">Risk Distribution</text>

  <!-- Header: total badge -->
  <rect x="336" y="27" width="100" height="22" rx="11" fill="#eaf2f8" stroke="#c8d9e6" stroke-width="1"/>
  <text x="386" y="42" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#2b5f78" letter-spacing="0.05em">15 FINDINGS</text>

  <!--
    Donut centre: (178, 164)  radius=80  stroke-width=28
    C = 2π×80 = 502.65
    Gap between segments = 4px each (4 gaps × 4 = 16px total)
    Effective C for segments = 502.65 - 16 = 486.65
    Segment lengths:
      Critical  2/15 × 486.65 = 64.9
      High      4/15 × 486.65 = 129.8
      Medium    6/15 × 486.65 = 194.7
      Low       3/15 × 486.65 = 97.3
    dasharray  = "segLen  (C - segLen)" with offset adjusted per segment
    Start angle: −90° → offset = −C/4 = −125.7
    Cumulative offset for each segment (negate for clockwise):
      offset = −125.7 (start at top)
      Critical  starts at offset −125.7, rotates 64.9 + 4 = 68.9
      High      offset −125.7 − 68.9 = −194.6
      Medium    offset −194.6 − 133.8 = −328.4
      Low       offset −328.4 − 198.7 = −527.1
  -->

  <!-- Track (background circle) -->
  <circle cx="178" cy="164" r="80" stroke="#f0f6fb" stroke-width="28" fill="none"/>

  <!-- Critical segment (red) - 64.9px of 502.65 -->
  <circle cx="178" cy="164" r="80"
    stroke="#c14438" stroke-width="28" fill="none"
    stroke-dasharray="64.9 437.75"
    stroke-dashoffset="125.7"
    stroke-linecap="butt"/>

  <!-- High segment (amber) - 129.8px -->
  <circle cx="178" cy="164" r="80"
    stroke="#c47d16" stroke-width="28" fill="none"
    stroke-dasharray="129.8 372.85"
    stroke-dashoffset="56.8"
    stroke-linecap="butt"/>

  <!-- Medium segment (blue) - 194.7px -->
  <circle cx="178" cy="164" r="80"
    stroke="#1a7ba4" stroke-width="28" fill="none"
    stroke-dasharray="194.7 307.95"
    stroke-dashoffset="-77.0"
    stroke-linecap="butt"/>

  <!-- Low segment (green) - 97.3px -->
  <circle cx="178" cy="164" r="80"
    stroke="#2a9c52" stroke-width="28" fill="none"
    stroke-dasharray="97.3 405.35"
    stroke-dashoffset="-275.7"
    stroke-linecap="butt"/>

  <!-- Inner fill (hides stroke artefacts, creates donut hole) -->
  <circle cx="178" cy="164" r="66" fill="white"/>
  <circle cx="178" cy="164" r="66" fill="url(#rd-inner)"/>

  <!-- Centre label -->
  <text x="178" y="157" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#0b3c5d" letter-spacing="-0.02em">15</text>
  <text x="178" y="174" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#425667" letter-spacing="0.04em" font-weight="600">FINDINGS</text>

  <!-- ── LEGEND (right side) ─────────────────────────────── -->
  <!-- Critical -->
  <rect x="296" y="88" width="12" height="12" rx="3" fill="#c14438"/>
  <text x="314" y="99" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#172532">Critical</text>
  <text x="414" y="99" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c14438">2</text>
  <text x="436" y="99" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#8aa5b8">13%</text>

  <!-- High -->
  <rect x="296" y="118" width="12" height="12" rx="3" fill="#c47d16"/>
  <text x="314" y="129" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#172532">High</text>
  <text x="414" y="129" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c47d16">4</text>
  <text x="436" y="129" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#8aa5b8">27%</text>

  <!-- Medium -->
  <rect x="296" y="148" width="12" height="12" rx="3" fill="#1a7ba4"/>
  <text x="314" y="159" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#172532">Medium</text>
  <text x="414" y="159" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a7ba4">6</text>
  <text x="436" y="159" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#8aa5b8">40%</text>

  <!-- Low -->
  <rect x="296" y="178" width="12" height="12" rx="3" fill="#2a9c52"/>
  <text x="314" y="189" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#172532">Low</text>
  <text x="414" y="189" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2a9c52">3</text>
  <text x="436" y="189" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#8aa5b8">20%</text>

  <!-- Divider line between legend rows -->
  <line x1="296" y1="113" x2="440" y2="113" stroke="#eef4f8" stroke-width="1"/>
  <line x1="296" y1="143" x2="440" y2="143" stroke="#eef4f8" stroke-width="1"/>
  <line x1="296" y1="173" x2="440" y2="173" stroke="#eef4f8" stroke-width="1"/>

  <!-- Legend container border -->
  <rect x="288" y="76" width="156" height="132" rx="12" stroke="#e8f0f6" stroke-width="1" fill="none"/>
</svg>
