<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" fill="none" aria-hidden="true">
  <defs>
    <filter id="ks-shadow" x="-8%" y="-8%" width="120%" height="128%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2a3c" flood-opacity="0.08"/>
    </filter>
    <radialGradient id="ks-glow-tl" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d9ebf6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#d9ebf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ks-glow-br" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#e0f2e8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#e0f2e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── CARD 1 · Review time (top-left) ───────────────────── -->
  <rect x="20" y="16" width="226" height="112" rx="18" fill="#ffffff" stroke="#d0dce7" stroke-width="1.5" filter="url(#ks-shadow)"/>
  <ellipse cx="60" cy="56" rx="80" ry="60" fill="url(#ks-glow-tl)"/>
  <!-- Icon: clock -->
  <circle cx="52" cy="60" r="18" fill="#eaf2f8"/>
  <circle cx="52" cy="60" r="11" stroke="#1a7ba4" stroke-width="2" fill="none"/>
  <path d="M52 54 L52 60 L56 63" stroke="#1a7ba4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Stat -->
  <text x="84" y="52" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="800" fill="#0b3c5d" letter-spacing="-0.03em">~8</text>
  <text x="84" y="76" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#425667">min review time</text>
  <!-- Trend tag -->
  <rect x="26" y="96" width="92" height="20" rx="10" fill="#eaf2f8"/>
  <text x="72" y="110" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#2b5f78" letter-spacing="0.04em">SAME DAY</text>

  <!-- ── CARD 2 · Avg findings (top-right) ─────────────────── -->
  <rect x="274" y="16" width="226" height="112" rx="18" fill="#ffffff" stroke="#d0dce7" stroke-width="1.5" filter="url(#ks-shadow)"/>
  <!-- Icon: list with flag -->
  <circle cx="306" cy="60" r="18" fill="#fdf3ea"/>
  <path d="M299 52 L299 68" stroke="#c47d16" stroke-width="2" stroke-linecap="round"/>
  <path d="M299 54 L308 57 L299 60" fill="#c47d16" fill-opacity="0.85"/>
  <!-- Stat -->
  <text x="338" y="52" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="800" fill="#0b3c5d" letter-spacing="-0.03em">15</text>
  <text x="338" y="76" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#425667">avg findings/report</text>
  <!-- Breakdown mini badges -->
  <rect x="280" y="96" width="32" height="20" rx="10" fill="rgba(193,68,52,0.10)"/>
  <text x="296" y="110" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#b83a30">2 crit</text>
  <rect x="318" y="96" width="32" height="20" rx="10" fill="rgba(196,125,22,0.10)"/>
  <text x="334" y="110" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#c47d16">4 high</text>
  <rect x="356" y="96" width="36" height="20" rx="10" fill="rgba(26,123,164,0.10)"/>
  <text x="374" y="110" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#1a7ba4">6 med</text>
  <rect x="398" y="96" width="30" height="20" rx="10" fill="rgba(42,156,82,0.10)"/>
  <text x="413" y="110" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#2a9c52">3 low</text>

  <!-- ── CARD 3 · Rating (bottom-left) ─────────────────────── -->
  <rect x="20" y="152" width="226" height="112" rx="18" fill="#ffffff" stroke="#d0dce7" stroke-width="1.5" filter="url(#ks-shadow)"/>
  <!-- Icon: star -->
  <circle cx="52" cy="196" r="18" fill="#fdf9ec"/>
  <path d="M52 184 L54.5 191.5 H62.5 L56 196 L58.5 203.5 L52 199 L45.5 203.5 L48 196 L41.5 191.5 H49.5 Z" fill="#c47d16" opacity="0.85"/>
  <!-- Stat -->
  <text x="84" y="188" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="800" fill="#0b3c5d" letter-spacing="-0.03em">4.9</text>
  <text x="84" y="212" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#425667">buyer satisfaction</text>
  <!-- Stars row -->
  <text x="26" y="244" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#c47d16">★★★★★</text>
  <text x="114" y="244" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8aa5b8">from verified buyers</text>

  <!-- ── CARD 4 · Quotes (bottom-right) ────────────────────── -->
  <rect x="274" y="152" width="226" height="112" rx="18" fill="#0b3c5d" stroke="#0b3c5d" stroke-width="1.5" filter="url(#ks-shadow)"/>
  <!-- Subtle glow inside dark card -->
  <ellipse cx="400" cy="180" rx="140" ry="100" fill="rgba(26,123,164,0.28)"/>
  <!-- Icon: people -->
  <circle cx="306" cy="196" r="18" fill="rgba(255,255,255,0.10)"/>
  <circle cx="306" cy="190" r="5" fill="rgba(255,255,255,0.75)"/>
  <path d="M298 205 C298 199 314 199 314 205" stroke="rgba(255,255,255,0.75)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- Stat -->
  <text x="338" y="188" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">3</text>
  <text x="338" y="212" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="rgba(255,255,255,0.70)">quotes per request</text>
  <!-- Auto tag -->
  <rect x="280" y="232" width="74" height="20" rx="10" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>
  <text x="317" y="246" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="rgba(255,255,255,0.80)" letter-spacing="0.05em">AUTO-SENT</text>
</svg>
