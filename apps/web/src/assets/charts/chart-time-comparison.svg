<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" fill="none" aria-hidden="true">
  <defs>
    <filter id="tc-shadow" x="-6%" y="-6%" width="116%" height="124%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f2a3c" flood-opacity="0.09"/>
    </filter>
    <radialGradient id="tc-glow" cx="28%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#d9ebf6" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#d9ebf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tc-bar-before" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7aa9c7"/>
      <stop offset="100%" stop-color="#a8c8dc"/>
    </linearGradient>
    <linearGradient id="tc-bar-after" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b3c5d"/>
      <stop offset="100%" stop-color="#1a6080"/>
    </linearGradient>
  </defs>

  <!-- Ambient glow -->
  <ellipse cx="140" cy="56" rx="190" ry="130" fill="url(#tc-glow)"/>

  <!-- Card -->
  <rect x="20" y="10" width="520" height="300" rx="22" fill="#ffffff" stroke="#d0dce7" stroke-width="1.5" filter="url(#tc-shadow)"/>

  <!-- Card header band -->
  <rect x="20" y="10" width="520" height="58" rx="22" fill="#f0f6fb"/>
  <rect x="20" y="48" width="520" height="20" fill="#f0f6fb"/>

  <!-- Header: title -->
  <text x="50" y="46" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0b3c5d" letter-spacing="-0.01em">Time Spent Preparing</text>

  <!-- Legend -->
  <rect x="354" y="30" width="14" height="14" rx="4" fill="#a8c8dc"/>
  <text x="374" y="41" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#425667" font-weight="500">Without</text>
  <rect x="440" y="30" width="14" height="14" rx="4" fill="#0b3c5d"/>
  <text x="460" y="41" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#425667" font-weight="500">With</text>

  <!-- Y-axis gridlines and labels -->
  <!-- max = 4h = 240min, chart height = 180px (y=78 to y=258) -->
  <!-- 4h line = y=78 -->
  <line x1="88" y1="78" x2="520" y2="78" stroke="#ebf2f7" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- 3h line = y=78+45=123 -->
  <line x1="88" y1="123" x2="520" y2="123" stroke="#ebf2f7" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- 2h line = y=78+90=168 -->
  <line x1="88" y1="168" x2="520" y2="168" stroke="#ebf2f7" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- 1h line = y=78+135=213 -->
  <line x1="88" y1="213" x2="520" y2="213" stroke="#ebf2f7" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- baseline y=258 -->
  <line x1="88" y1="258" x2="520" y2="258" stroke="#d0dce7" stroke-width="1.5"/>

  <!-- Y-axis labels -->
  <text x="82" y="82"  text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#8aa5b8">4h</text>
  <text x="82" y="127" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#8aa5b8">3h</text>
  <text x="82" y="172" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#8aa5b8">2h</text>
  <text x="82" y="217" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#8aa5b8">1h</text>
  <text x="82" y="262" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#8aa5b8">0</text>

  <!-- Y-axis tick line -->
  <line x1="90" y1="78" x2="90" y2="258" stroke="#d0dce7" stroke-width="1.5"/>

  <!--
    Group 1: "Read contract" - before=3.5h, after=20min
    3.5h = 210min → 210/240 * 180 = 157.5px tall → y=258-157.5=100.5 ≈ 101
    20min → 20/240 * 180 = 15px tall → y=258-15=243
    Group centre x = 166
  -->
  <!-- Before bar -->
  <rect x="130" y="101" width="48" height="157" rx="10" fill="url(#tc-bar-before)"/>
  <!-- After bar -->
  <rect x="184" y="243" width="48" height="15" rx="6" fill="url(#tc-bar-after)"/>
  <!-- Value labels -->
  <text x="154" y="95" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#425667">3.5h</text>
  <text x="208" y="237" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0b3c5d">20m</text>
  <!-- Group label -->
  <text x="171" y="276" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#425667" font-weight="500">Contract review</text>

  <!--
    Group 2: "First solicitor meeting" - before=90min, after=45min
    90min → 90/240 * 180 = 67.5px → y=258-67.5=190.5 ≈ 191
    45min → 45/240 * 180 = 33.75px → y=258-33.75=224.25 ≈ 224
    Group centre x = 310
  -->
  <rect x="274" y="191" width="48" height="67" rx="10" fill="url(#tc-bar-before)"/>
  <rect x="328" y="224" width="48" height="34" rx="10" fill="url(#tc-bar-after)"/>
  <text x="298" y="185" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#425667">90m</text>
  <text x="352" y="218" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0b3c5d">45m</text>
  <text x="315" y="276" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#425667" font-weight="500">Solicitor meeting</text>

  <!--
    Group 3: "Follow-up questions" - before=45min, after=0min (done in report)
    45min → 33.75px → y=224
    0 → show as 0
    Group centre x = 455
  -->
  <rect x="418" y="224" width="48" height="34" rx="10" fill="url(#tc-bar-before)"/>
  <!-- "0" bar: show tiny 4px bar with hatching to indicate eliminated -->
  <rect x="472" y="254" width="48" height="4" rx="2" fill="#0b3c5d" opacity="0.5"/>
  <text x="442" y="218" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#425667">45m</text>
  <!-- "Eliminated" badge -->
  <rect x="462" y="238" width="66" height="18" rx="9" fill="#edf7f2" stroke="#b8d9c6" stroke-width="1"/>
  <text x="495" y="251" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#1f7a3d" letter-spacing="0.03em">ELIMINATED</text>
  <text x="455" y="276" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#425667" font-weight="500">Follow-up questions</text>

  <!-- Savings callout -->
  <rect x="96" y="290" width="368" height="22" rx="11" fill="#eaf2f8" stroke="#cadbe7" stroke-width="1"/>
  <text x="280" y="305" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#2b5f78">Save an estimated 4+ hours of unguided preparation time</text>
</svg>
