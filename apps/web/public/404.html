<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ConveyMate | Page not found</title>
  <style>
    :root {
      --page-bg: #f4f7fa;
      --surface: #ffffff;
      --border: #d7e2eb;
      --text: #172532;
      --text-muted: #536576;
      --accent: #0b3c5d;
      --accent-hover: #0a314d;
      --sans: Inter, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background:
        radial-gradient(circle at top left, rgba(11, 60, 93, 0.12), transparent 26%),
        linear-gradient(180deg, #f8fbfd 0%, var(--page-bg) 100%);
      color: var(--text);
      font-family: var(--sans);
    }

    .shell {
      width: min(680px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 2.2rem;
      box-shadow: 0 18px 42px rgba(17, 35, 52, 0.08);
    }

    .eyebrow {
      margin: 0 0 0.9rem;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      color: #5b7689;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(2.4rem, 6vw, 3.4rem);
      line-height: 1.04;
      letter-spacing: -0.03em;
    }

    p {
      margin: 1rem 0 0;
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.75;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      margin-top: 1.7rem;
    }

    .actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0.8rem 1.1rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease;
    }

    .actions a:first-child {
      background: var(--accent);
      color: #ffffff;
    }

    .actions a:first-child:hover {
      background: var(--accent-hover);
    }

    .actions a:last-child {
      border: 1px solid var(--border);
      color: var(--accent);
      background: #f7fbff;
    }

    .actions a:last-child:hover {
      border-color: #a9bfce;
      background: #eef6fc;
    }
  </style>
</head>
<body>
  <main class="shell">
    <p class="eyebrow">ConveyMate</p>
    <h1>That page is no longer here.</h1>
    <p>The insight, guide, or page you requested could not be found. If you were following an older article link, the content may have been removed or replaced.</p>
    <div class="actions">
      <a href="/">Go to the homepage</a>
      <a href="/insights">Browse insights</a>
    </div>
  </main>
</body>
</html>
