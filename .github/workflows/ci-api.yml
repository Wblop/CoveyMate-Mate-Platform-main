name: API Build

on:
  push:
    branches: [main]

jobs:
  api:
    name: API Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build API solution
        run: dotnet build apps/apis/conveymate-api/ConveyMate.Api.sln --configuration Release
